<style>
/* ===== 共用色彩與字體（四大測驗統一使用） ===== */
:root {
  --bg: #f6f5f2;          /* 頁面底色：溫和米白 */
  --surface: #ffffff;     /* 卡片、區塊底色 */
  --text: #2b2b2b;        /* 主要文字 */
  --muted: #6b6b6b;       /* 次要文字 */
  --line: #e2e0da;        /* 分隔線、外框 */
  --brand: #35628E;       /* 主色：按鈕 */
  --brand-dark: #284c6e;
  --accent: #1D9E75;      /* 何倫碼的強調色：六角形、前三碼 */
  --accent-dark: #0F6E56;
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.5;
}
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

/* ===== 頁首與步驟指示 ===== */
header { padding: 20px 0 8px; text-align: center; }
h1 { font-size: 26px; margin: 0 0 12px; letter-spacing: 1px; }
.steps { display: flex; justify-content: center; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 15px; color: var(--muted); }
.steps li { padding: 4px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.steps li.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }

/* ===== 說明頁 ===== */
.intro { text-align: center; padding: 8px 0 4px; }
.intro .desc { font-size: 18px; margin: 12px 0; }
.intro .flow { font-size: 16px; color: var(--brand); font-weight: 600; margin: 12px 0; }
.intro .note { font-size: 15px; color: var(--muted); margin: 12px 0 22px; }
.intro .start-btn { display: block; width: 100%; margin: 0 0 12px; padding: 16px; font-size: 19px; }

/* ===== 作答 ===== */
.question {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 16px;
  margin: 14px 0;
  text-align: center;
}
.question .no { font-size: 14px; color: var(--muted); }
.question .ask { font-size: 15px; color: var(--muted); margin-top: 8px; }
.question .text { font-size: 22px; font-weight: 700; margin: 4px 0 18px; }
.answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ans {
  font: inherit; font-size: 18px; font-weight: 700;
  border: 3px solid transparent; border-radius: 12px;
  padding: 16px 4px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.ans.like { background: #3E8E5A; color: #fff; }
.ans.ok { background: #EBC24A; color: #3a2a00; }
.ans.dislike { background: #D9653B; color: #fff; }
.ans.chosen { border-color: var(--text); }
.progress { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); }
.progress .track { flex: 1; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.progress .fill { height: 100%; background: var(--brand); border-radius: 5px; transition: width .2s; }

/* ===== 結果 ===== */
.result-meta { text-align: center; color: var(--muted); font-size: 16px; margin: 4px 0 10px; }
.notice { text-align: center; color: var(--muted); font-size: 15px; margin: 12px 0; }
.panel-box {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 12px; margin: 12px 0;
}
.code-title { text-align: center; font-size: 15px; color: var(--muted); margin: 0; }
.code { text-align: center; font-size: 44px; font-weight: 700; letter-spacing: 6px; color: var(--accent-dark); margin: 0; line-height: 1.2; }
.code-names { text-align: center; font-size: 15px; color: var(--muted); margin: 2px 0 0; }
.tie { text-align: center; font-size: 15px; color: var(--accent-dark); font-weight: 600; margin: 4px 0 0; }

.hexagon { display: block; width: 100%; max-width: 420px; margin: 4px auto 0; }
.bars { margin-top: 6px; }
.bar-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 16px; }
.bar-row .label { flex: 0 0 76px; }
.bar-row .track { flex: 1; height: 16px; border-radius: 8px; background: var(--bg); overflow: hidden; }
.bar-row .fill { height: 100%; border-radius: 8px; background: #b4b2a9; }
.bar-row.top .fill { background: var(--accent); }
.bar-row.top .label { color: var(--accent-dark); font-weight: 700; }
.bar-row .num { flex: 0 0 28px; text-align: right; font-weight: 700; }

.advice h3 { font-size: 16px; color: var(--muted); margin: 0 0 6px; }

/* 三碼類型卡 */
.types-title { font-size: 18px; text-align: center; margin: 0 0 6px; }
.reading { font-size: 16px; color: var(--text); line-height: 1.7; margin: 0 0 12px; }
/* 白底卡片、深色文字；欄位標題用深綠色，提醒另外用淡橘色框標出 */
.type-card { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent); border-radius: 12px; padding: 14px 16px; margin-top: 14px; }
.type-head { display: flex; align-items: center; gap: 8px; }
.type-head .rank { font-size: 14px; font-weight: 700; color: #fff; background: var(--accent-dark); border-radius: 999px; padding: 2px 10px; }
.type-head b { font-size: 21px; color: var(--accent-dark); }
.type-card .summary { font-size: 17px; font-weight: 700; color: #0b3d31; background: #E6F2EF; border-radius: 8px; padding: 8px 12px; margin: 10px 0 4px; line-height: 1.6; }
.type-card dl { margin: 0; }
.type-card dt { font-size: 15px; font-weight: 700; color: var(--accent-dark); margin-top: 12px; }
.type-card dd { margin: 2px 0 0; font-size: 16px; color: var(--text); line-height: 1.7; }
.type-card dt.caution { color: #8a5300; }
.type-card dd.caution { background: #FFF4E0; border-radius: 8px; padding: 8px 12px; margin-top: 4px; color: #3d2600; }
.advice p { margin: 0 0 10px; line-height: 1.7; }
/* 下一步：看完分數就看到（104 連結，或興趣還沒分化時的說明＋LINE） */
.next-step { margin: 16px 0; text-align: center; }
.next-step h3 { font-size: 16px; color: var(--muted); margin: 0 0 8px; }
.links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.link-btn104 {
  flex: 1 1 140px; max-width: 320px;
  display: block; text-decoration: none; text-align: center;
  font-size: 20px; font-weight: 700; color: #fff; background: var(--brand);
  border-radius: 12px; padding: 12px 14px;
}
.link-btn104 small { display: block; font-size: 14px; font-weight: 400; opacity: .9; }
.even-text {
  background: var(--surface); border: 2px solid var(--accent); border-radius: var(--radius);
  padding: 14px 16px; margin: 0 0 12px; text-align: left; line-height: 1.7; font-weight: 600;
}
.line-btn {
  display: inline-block; text-decoration: none;
  font-size: 18px; font-weight: 700; color: #fff; background: #06C755;
  border-radius: 12px; padding: 12px 22px;
}

/* ===== 按鈕 ===== */
.btn {
  border: none; border-radius: 12px;
  padding: 12px 18px;
  font: inherit; font-size: 17px; font-weight: 600;
  cursor: pointer;
  background: var(--brand); color: #fff;
}
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 16px 0; }

/* ===== 結果圖片視窗 ===== */
.overlay {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.overlay .panel {
  background: var(--surface); border-radius: var(--radius);
  max-width: 480px; width: 100%; max-height: 90vh; overflow: auto;
  padding: 16px; text-align: center;
}
.overlay img { width: 100%; border: 1px solid var(--line); border-radius: 8px; }

/* ===== 頁尾 ===== */
footer { text-align: center; color: var(--muted); font-size: 14px; padding: 24px 0 32px; line-height: 1.8; }
</style>

<div class="wrap">
  <header>
    <h1>何倫碼職業興趣測驗</h1>

      <li data-step="quiz">1 作答</li>

    </ol>
  </header>

  <!-- 版權宣告 -->
  <footer>

    並由莊士勇諮詢師依現代職場情境重新設計。<br>

<!-- 載入題目與代碼說明 -->
<script src="holland-questions.js?v=20261111"></script>
<script src="holland-results.js?v=20261111"></script>

<script>
// ===== 作答進度 =====
// 只暫存在使用者自己的瀏覽器（不會上傳），方便不小心重新整理時接著做；超過 24 小時自動作廢。
const STORAGE_KEY = 'holland-progress';
const EXPIRE_MS = 24 * 60 * 60 * 1000;

// ===== 測驗設定 =====
// 六角形的順序：R I A S E C（相鄰的類型性質相近，對角的類型性質相反）
const TYPES = ['R', 'I', 'A', 'S', 'E', 'C'];
const NAMES = { R: '實作型', I: '研究型', A: '藝術型', S: '社會型', E: '企業型', C: '事務型' };
const ANSWERS = [
  { score: 2, label: '喜歡', cls: 'like' },
  { score: 1, label: '還好', cls: 'ok' },
  { score: 0, label: '不喜歡', cls: 'dislike' }
];
const MAX_SCORE = 2 * hollandQuestions.filter(q => q.type === 'R').length; // 每型最高分（20）
const LINK_104 = 'https://guide.104.com.tw/wow/jobworld/holland/?code=';

let state = loadState() || newState();

function newState() {
  return {
    v: 1,
    step: 'intro',
    qOrder: [],     // 打散後的題目順序
    answers: [],    // 每一題的分數（2／1／0）
    current: 0,
    finishedAt: null,
    savedAt: Date.now()
  };
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!s || Date.now() - s.savedAt > EXPIRE_MS) return null;
    if (s.v !== 1 || (s.qOrder.length && s.qOrder.length !== hollandQuestions.length)) return null; // 題目有更新時重來
    return s;
  } catch (e) { return null; }
}

function saveState() {
  state.savedAt = Date.now();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function start() {
  state = newState();
  state.qOrder = shuffle([...hollandQuestions.keys()]);
  go('quiz');
}

// ===== 畫面切換 =====
const app = document.getElementById('app');

function go(step) {
  state.step = step;
  saveState();
  render();
  window.scrollTo(0, 0);
}

function render() {
  document.getElementById('steps').hidden = state.step === 'intro';
  document.querySelectorAll('#steps li').forEach(li => {
    li.classList.toggle('on', li.dataset.step === state.step);
  });
  if (state.step === 'intro') renderIntro();
  else if (state.step === 'quiz') renderQuiz();
  else renderResult();
}

// ===== 說明頁 =====
function renderIntro() {
  app.innerHTML = `
    <div class="intro">
      <p class="desc">透過 ${hollandQuestions.length} 項日常活動，<br>找出你的職業興趣類型</p>
      <p class="flow">① 作答 → ② 結果</p>
      <p class="note">依照你的感覺選擇，沒有對錯<br>不需填寫個人資料，結果只存在你的手機</p>
      <button type="button" class="btn start-btn" id="start">開始</button>
    </div>`;
  document.getElementById('start').onclick = start;
}

// ===== 第 1 步：作答 =====
function renderQuiz() {
  const total = state.qOrder.length;
  const i = state.current;
  const q = hollandQuestions[state.qOrder[i]];

  app.innerHTML = `
    <div class="question">
      <div class="no">第 ${i + 1} 題</div>
      <div class="ask">你喜歡做這件事嗎？</div>
      <div class="text">${q.text}</div>
      <div class="answers">
        ${ANSWERS.map(a => `<button type="button" class="ans ${a.cls}${state.answers[i] === a.score ? ' chosen' : ''}" data-score="${a.score}">${a.label}</button>`).join('')}
      </div>
    </div>
    <div class="progress">
      <div class="track"><div class="fill" style="width:${(i + 1) / total * 100}%"></div></div>
      <span>${i + 1} / ${total}</span>
    </div>
    <div class="btn-row">
      ${i > 0 ? '<button type="button" class="btn ghost" id="prev">← 上一題</button>' : ''}
    </div>`;

  app.querySelectorAll('.ans').forEach(btn => {
    btn.onclick = () => answer(Number(btn.dataset.score));
  });
  if (i > 0) document.getElementById('prev').onclick = () => {
    state.current--;
    saveState();
    renderQuiz();
  };
}

// 選完自動進入下一題，最後一題選完就看結果
function answer(score) {
  state.answers[state.current] = score;
  if (state.current < state.qOrder.length - 1) {
    state.current++;
    saveState();
    renderQuiz();
    window.scrollTo(0, 0);
  } else {
    state.finishedAt = Date.now();
    go('result');
  }
}

// ===== 第 2 步：結果 =====
function formatTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// 計分與何倫碼：同分時依 R I A S E C 的順序排，並另外標示同分
function analyze() {
  const scores = { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 };
  state.qOrder.forEach((qi, i) => { scores[hollandQuestions[qi].type] += state.answers[i]; });
  const sorted = [...TYPES].sort((a, b) => scores[b] - scores[a]);
  const code = sorted.slice(0, 3);
  // 和第三碼同分（或更高）的都算候選，用來列出同分與 104 連結
  const third = scores[code[2]];
  const candidates = sorted.filter(t => scores[t] >= third);
  const ties = [];
  candidates.forEach(t => {
    const group = candidates.filter(x => scores[x] === scores[t]);
    if (group.length > 1 && group[0] === t) ties.push(group);
  });
  // 興趣還沒分化時不列 104 連結，改顯示說明：最高分偏低用 LOW_TEXT，三型以上同分用 EVEN_TEXT
  const low = scores[sorted[0]] <= LOW_MAX;
  const pairs = low ? null : pairs104(scores);
  const note = pairs ? null : low ? LOW_TEXT : EVEN_TEXT;
  return { scores, sorted, code, ties, pairs, note };
}

// 104 職業查詢只收兩碼。規則：
// - 最高分三型以上同分：不列連結（回傳 null），改顯示說明
// - 最高分兩型同分（例如 A、E）：列兩組 AE、EA
// - 最高分只有一型（例如 A）：
//     第二高分一型 → 一組（例如 AE）
//     第二高分兩型同分（例如 E、S）→ 兩組 AE、AS
//     第二高分三型以上同分 → 不列連結，改顯示說明
// 同分的類型依 R I A S E C 順序排
function pairs104(scores) {
  const levels = [...new Set(TYPES.map(t => scores[t]))].sort((a, b) => b - a);
  const group = s => TYPES.filter(t => scores[t] === s);
  const first = group(levels[0]);
  if (first.length >= 3) return null;
  if (first.length === 2) return [first[0] + first[1], first[1] + first[0]];
  const second = group(levels[1]);
  if (second.length >= 3) return null;
  return second.map(t => first[0] + t);
}

// 不列 104 連結時的說明與聯絡方式
const LOW_MAX = 6; // 最高分在這個分數以下（滿分 20 的三分之一以下），視為「低而平均」
const EVEN_TEXT = '你的興趣分布相當平均，代表你有多元發展的可能，也可能還在探索階段。這類結果需要進一步對話才看得清楚，歡迎聯繫 Steven 莊老師。';
const LOW_TEXT = '你對這些活動的興趣普遍不高，可能是還沒有機會接觸，也可能是最近的狀態讓你提不起勁。這類結果需要進一步對話才看得清楚，歡迎聯繫 Steven 莊老師。';
const LINE_ID = '@232biwoo';
const LINE_URL = 'https://line.me/R/ti/p/' + LINE_ID;

// 三碼類型卡
const RANKS = ['第一碼', '第二碼', '第三碼'];
const READING_NOTE = '何倫碼的三個字母依興趣強弱排列：<strong>第一碼</strong>是你最主要的興趣，<strong>第二碼</strong>是重要的搭配，<strong>第三碼</strong>是輔助的特質。三者合在一起，才是完整的你。';
const CARD_FIELDS = [
  ['traits', '特質'],
  ['activities', '喜歡的活動'],
  ['environment', '適合的工作環境'],
  ['careers', '代表職業'],
  ['caution', 'Steven 莊老師的提醒']
];

function typeCardHtml(t, k) {
  const c = typeCards[t];
  return `
    <div class="type-card">
      <div class="type-head"><span class="rank">${RANKS[k]}</span><b>${t} ${NAMES[t]}</b></div>
      <p class="summary">${c.summary}</p>
      <dl>${CARD_FIELDS.map(([f, label]) => `<dt${f === 'caution' ? ' class="caution"' : ''}>${label}</dt><dd${f === 'caution' ? ' class="caution"' : ''}>${c[f]}</dd>`).join('')}</dl>
    </div>`;
}

function tieText(ties) {
  return ties.map(g => g.join('、') + ' 同分').join('；');
}

function renderResult() {
  const { scores, sorted, code, ties, pairs, note } = analyze();
  const key = code[0] + code[1];
  const info = codeAdvice[key];

  app.innerHTML = `
    <div class="result-meta">完成時間：${formatTime(state.finishedAt)}</div>
    <div class="panel-box">
      <p class="code-title">你的何倫碼</p>
      <p class="code">${code.join('')}</p>
      <p class="code-names">${code.map(t => `(${t})${NAMES[t]}`).join('＋')}</p>
      ${ties.length ? `<p class="tie">${tieText(ties)}</p>` : ''}
      ${hexagonSvg(scores, code)}
      <div class="bars">
        ${sorted.map(t => `
          <div class="bar-row${code.includes(t) ? ' top' : ''}">
            <span class="label">${NAMES[t]} ${t}</span>
            <span class="track"><span class="fill" style="display:block;width:${scores[t] / MAX_SCORE * 100}%"></span></span>
            <span class="num">${scores[t]}</span>
          </div>`).join('')}
      </div>
    </div>
    <div class="next-step">
      ${pairs ? `
      <h3>下一步：到 104 查看適合的職業</h3>
      <div class="links">
        ${pairs.map(p => `<a class="link-btn104" href="${LINK_104}${p}" target="_blank" rel="noopener">${p}<small>${NAMES[p[0]]}＋${NAMES[p[1]]}</small></a>`).join('')}
      </div>` : `
      <p class="even-text">${note}</p>
      <a class="line-btn" href="${LINE_URL}" target="_blank" rel="noopener">加入 Steven 莊老師的 LINE</a>`}
    </div>
    <div class="panel-box">
      <h2 class="types-title">你的三碼代表什麼</h2>
      <p class="reading">${READING_NOTE}</p>
      ${code.map((t, k) => typeCardHtml(t, k)).join('')}
    </div>
    <div class="panel-box advice">
      <h3>前兩碼組合　${key}：${NAMES[code[0]]}＋${NAMES[code[1]]}</h3>
      <p>${info.advice}</p>
      <p>${info.careers}</p>
    </div>
    <div class="btn-row">
      <button class="btn" id="save">下載結果圖片</button>
    </div>
    <div class="notice"><strong>請下載結果圖片或截圖本頁面，<br>請 Steven 莊老師為您解讀喔</strong></div>
    <div class="btn-row">
      <button class="btn ghost" id="restart">重新開始</button>
    </div>`;

  document.getElementById('save').onclick = showImage;
  document.getElementById('restart').onclick = () => {
    if (!confirm('確定要重新開始嗎？目前的作答結果會被清除。')) return;
    clearState();
    state = newState();
    go('intro');
  };
}

// ===== 何倫六角形（網頁用 SVG，圖片用 canvas，兩者用同一組座標） =====
// 從左上的 R 開始順時針：R 左上、I 右上、A 右、S 右下、E 左下、C 左
function hexPoint(cx, cy, r, k) {
  const angle = (-120 + k * 60) * Math.PI / 180;
  return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
}

function hexagonSvg(scores, code) {
  const cx = 170, cy = 150, R = 100;
  const ring = f => TYPES.map((t, k) => hexPoint(cx, cy, R * f, k).map(n => n.toFixed(1)).join(',')).join(' ');
  const shape = TYPES.map((t, k) => hexPoint(cx, cy, R * scores[t] / MAX_SCORE, k).map(n => n.toFixed(1)).join(',')).join(' ');
  const spokes = TYPES.map((t, k) => {
    const [x, y] = hexPoint(cx, cy, R, k);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e2e0da"/>`;
  }).join('');
  const labels = TYPES.map((t, k) => {
    const [x, y] = hexPoint(cx, cy, R + 34, k);
    const top = code.includes(t);
    const color = top ? 'var(--accent-dark)' : 'var(--muted)';
    return `<text x="${x.toFixed(1)}" y="${(y - 2).toFixed(1)}" style="fill:${color};font-weight:${top ? 700 : 400}">${NAMES[t].slice(0, 2)} ${t}</text>
      <text x="${x.toFixed(1)}" y="${(y + 17).toFixed(1)}" style="fill:${color};font-weight:700">${scores[t]}</text>`;
  }).join('');
  return `
    <svg class="hexagon" viewBox="0 0 340 300" role="img" aria-label="何倫六角形">
      <polygon points="${ring(1)}" fill="none" stroke="#b4b2a9" stroke-width="1.5"/>
      <polygon points="${ring(0.5)}" fill="none" stroke="#e2e0da"/>
      ${spokes}
      <polygon points="${shape}" fill="#1D9E75" fill-opacity="0.25" stroke="#1D9E75" stroke-width="2.5" stroke-linejoin="round"/>
      <g font-size="15" text-anchor="middle">${labels}</g>
    </svg>`;
}

// ===== 產生結果圖片（在手機上畫，不經過網路） =====
// 中文逐字斷行
function wrapLines(ctx, text, maxWidth) {
  const lines = [];
  let line = '';
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxWidth && line) {
      lines.push(line);
      line = ch;
    } else {
      line += ch;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawResultImage() {
  const W = 1080, PAD = 60, LINE = 46;
  const { scores, sorted, code, ties, pairs, note } = analyze();
  const key = code[0] + code[1];
  const info = codeAdvice[key];
  const fontFamily = getComputedStyle(document.body).fontFamily;
  const font = (size, weight) => `${weight || 400} ${size}px ${fontFamily}`;

  const measure = document.createElement('canvas').getContext('2d');
  measure.font = font(30);
  const adviceLines = wrapLines(measure, info.advice, W - PAD * 2);
  const careerLines = wrapLines(measure, info.careers, W - PAD * 2);
  const typeLines = code.map((t, k) => wrapLines(measure, `${RANKS[k]} ${t} ${NAMES[t]}：${typeCards[t].summary}`, W - PAD * 2));
  const TYPES_H = 60 + typeLines.flat().length * LINE + typeLines.length * 16 + 40;
  measure.font = font(30, 700);
  const tailLines = pairs
    ? [`104 查詢代碼：${pairs.join('、')}`]
    : wrapLines(measure, note, W - PAD * 2).concat([`Steven 莊老師的 LINE：${LINE_ID}`]);

  const HEX_TOP = ties.length ? 400 : 360, HEX_R = 220;
  const BARS_TOP = HEX_TOP + HEX_R * 2 + 230;
  const TEXT_TOP = BARS_TOP + 6 * 62 + 40 + TYPES_H;
  const H = TEXT_TOP + 70 + (adviceLines.length + careerLines.length) * LINE + 30 + 70 + tailLines.length * LINE + 130;

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#f6f5f2';
  ctx.fillRect(0, 0, W, H);

  // 標題、完成時間、何倫碼
  ctx.textAlign = 'center';
  ctx.fillStyle = '#2b2b2b';
  ctx.font = font(56, 700);
  ctx.fillText(document.title, W / 2, 100);
  ctx.fillStyle = '#6b6b6b';
  ctx.font = font(30);
  ctx.fillText(`完成時間：${formatTime(state.finishedAt)}`, W / 2, 155);
  ctx.fillText('你的何倫碼', W / 2, 220);
  ctx.fillStyle = '#0F6E56';
  ctx.font = font(96, 700);
  ctx.fillText(code.join(''), W / 2, 310);
  ctx.fillStyle = '#6b6b6b';
  ctx.font = font(30);
  ctx.fillText(code.map(t => `(${t})${NAMES[t]}`).join('＋'), W / 2, 355);
  if (ties.length) {
    ctx.fillStyle = '#0F6E56';
    ctx.font = font(30, 700);
    ctx.fillText(tieText(ties), W / 2, 395);
  }

  // 六角形
  const cx = W / 2, cy = HEX_TOP + HEX_R + 110; // 上方留空間給頂點標籤
  const path = f => {
    ctx.beginPath();
    TYPES.forEach((t, k) => {
      const [x, y] = hexPoint(cx, cy, HEX_R * f(t), k);
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath();
  };
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#b4b2a9';
  path(() => 1);
  ctx.stroke();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#e2e0da';
  path(() => 0.5);
  ctx.stroke();
  TYPES.forEach((t, k) => {
    const [x, y] = hexPoint(cx, cy, HEX_R, k);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.stroke();
  });
  path(t => scores[t] / MAX_SCORE);
  ctx.fillStyle = 'rgba(29,158,117,0.25)';
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#1D9E75';
  ctx.stroke();
  TYPES.forEach((t, k) => {
    const [x, y] = hexPoint(cx, cy, HEX_R + 75, k);
    const top = code.includes(t);
    ctx.fillStyle = top ? '#0F6E56' : '#6b6b6b';
    ctx.font = font(32, top ? 700 : 400);
    ctx.fillText(`${NAMES[t].slice(0, 2)} ${t}`, x, y - 4);
    ctx.font = font(34, 700);
    ctx.fillText(String(scores[t]), x, y + 36);
  });

  // 長條
  sorted.forEach((t, k) => {
    const y = BARS_TOP + k * 62;
    const top = code.includes(t);
    ctx.textAlign = 'left';
    ctx.fillStyle = top ? '#0F6E56' : '#2b2b2b';
    ctx.font = font(32, top ? 700 : 400);
    ctx.fillText(`${NAMES[t]} ${t}`, PAD, y + 30);
    const bx = PAD + 190, bw = W - PAD * 2 - 190 - 70;
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, bx, y + 6, bw, 30, 15);
    ctx.fill();
    if (scores[t] > 0) {
      ctx.fillStyle = top ? '#1D9E75' : '#b4b2a9';
      roundRect(ctx, bx, y + 6, Math.max(30, bw * scores[t] / MAX_SCORE), 30, 15);
      ctx.fill();
    }
    ctx.textAlign = 'right';
    ctx.fillStyle = '#2b2b2b';
    ctx.font = font(32, 700);
    ctx.fillText(String(scores[t]), W - PAD, y + 32);
  });

  // 三碼各一句話
  let y = TEXT_TOP - TYPES_H;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#6b6b6b';
  ctx.font = font(32, 700);
  ctx.fillText('你的三碼代表什麼', PAD, y);
  ctx.fillStyle = '#0F6E56';
  ctx.font = font(30);
  typeLines.forEach(lines => {
    y += 16;
    lines.forEach(line => { y += LINE; ctx.fillText(line, PAD, y); });
  });

  // 說明文字
  y = TEXT_TOP;
  ctx.fillStyle = '#6b6b6b';
  ctx.font = font(32, 700);
  ctx.fillText(`前兩碼組合　${key}：${NAMES[code[0]]}＋${NAMES[code[1]]}`, PAD, y);
  y += 20;
  ctx.fillStyle = '#2b2b2b';
  ctx.font = font(30);
  adviceLines.forEach(line => { y += LINE; ctx.fillText(line, PAD, y); });
  y += 20;
  careerLines.forEach(line => { y += LINE; ctx.fillText(line, PAD, y); });
  y += 70 - LINE;
  ctx.fillStyle = '#6b6b6b';
  ctx.font = font(30, 700);
  tailLines.forEach(line => { y += LINE; ctx.fillText(line, PAD, y); });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#6b6b6b';
  ctx.font = font(26);
  ctx.fillText('© 2025–2026 GCDF全球職涯發展師 莊士勇 Steven 設計', W / 2, H - 70);
  ctx.fillText('shihyungchuang.github.io/holland', W / 2, H - 30);
  return canvas;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function showImage() {
  const url = drawResultImage().toDataURL('image/png');
  const d = new Date(state.finishedAt);
  const name = `何倫碼_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.png`;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="panel">
      <img src="${url}" alt="何倫碼測驗結果">
      <p class="notice">手機請<strong>長按圖片</strong>儲存到相簿</p>
      <div class="btn-row">
        <a class="btn" href="${url}" download="${name}" style="text-decoration:none">下載圖片</a>
        <button class="btn ghost" id="closeImg">關閉</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeImg').onclick = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
}

render();
</script>
